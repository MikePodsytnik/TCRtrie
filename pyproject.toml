[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "tcrtrie"
version = "0.2.0"
description = "Python bindings for TCR trie search"
requires-python = ">=3.8"
dependencies = ["pandas>=1.5"]

[project.scripts]
tcrtrie-vdjdb-update = "tcrtrie.cli_vdjdb_update:main"

[tool.scikit-build]
wheel.packages = ["tcrtrie"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tcrtrie = ["data/matrices/*.txt"]
