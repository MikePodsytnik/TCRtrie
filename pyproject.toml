[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "tcrtrie"
version = "0.2.3"
description = "Python bindings for TCR trie search"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pandas>=1.5"]

[project.scripts]
tcrtrie-vdjdb-update = "tcrtrie.cli_vdjdb_update:main"

[tool.scikit-build]
wheel.packages = ["tcrtrie"]
sdist.exclude = [
  ".venv/",
  ".venv-*/",
  "venv/",
  "env/",
  "examples/",
  ".git",
  ".idea",
  "__MACOSX",
  ".DS_Store",
  "**/__pycache__",
  "**/*.pyc",
]